<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you - NexaCart Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070d;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--text:#eef0ff;--muted:#8b8fa8;--a:#7c5cff;--b:#00e0c6;--grad:linear-gradient(135deg,var(--a),var(--b))}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
h1,.logo{font-family:Sora,sans-serif}
.orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:.35;z-index:-1}
.o1{width:520px;height:520px;background:var(--a);top:-160px;left:-120px}
.o2{width:460px;height:460px;background:var(--b);bottom:-180px;right:-120px}
.box{width:min(480px,100%);padding:40px 32px;border-radius:24px;background:#0f0f1a;border:1px solid var(--line);text-align:center}
.logo{font-size:22px;font-weight:800;margin-bottom:28px}
.logo span{background:var(--grad);-webkit-background-clip:text;color:transparent}
.check{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
h1{font-size:28px;letter-spacing:-.5px;margin-bottom:12px}
p{color:var(--muted);line-height:1.6;margin-bottom:8px}
.btn{display:inline-block;margin-top:24px;padding:14px 30px;border-radius:14px;background:var(--grad);color:#fff;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="box">
  <div class="logo">Nexa<span>Cart</span> Shop</div>
  <div class="check">&#10003;</div>
  <h1>Payment received!</h1>
  <p>Check your email for your order.</p>
  <p>Need help? Contact us on WhatsApp or Telegram.</p>
  <a href="/" class="btn">Back to shop</a>
</div>
</body>
</html>
