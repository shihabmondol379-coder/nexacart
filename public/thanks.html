<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your order - NexaCart Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07070d;color:#eef0ff;font-family:Inter,sans-serif;padding:20px}
.orb{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:.3;z-index:-1;background:#7c5cff;top:-150px;left:-150px}
.box{width:min(480px,100%);padding:40px;border-radius:24px;background:#0f0f1a;border:1px solid rgba(255,255,255,.09);text-align:center}
h1{font-family:Sora;font-size:26px;margin:16px 0 8px}
p{color:#8b8fa8;line-height:1.6}
.spin{width:48px;height:48px;margin:0 auto;border:4px solid rgba(255,255,255,.1);border-top-color:#00e0c6;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.code{margin:22px 0;padding:18px;border-radius:14px;background:#07070d;border:1px dashed #00e0c6;font-family:monospace;font-size:18px;word-break:break-all}
.btn{display:inline-block;padding:13px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c5cff,#00e0c6);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.home{display:block;margin-top:18px;color:#8b8fa8;font-size:14px}
</style>
</head>
<body>
<div class="orb"></div>
<div class="box" id="box">
  <div class="spin"></div>
  <h1>Confirming your payment...</h1>
  <p>This usually takes a few minutes. Keep this page open; your item will appear here automatically.</p>
</div>
<script>
const q = new URLSearchParams(location.search);
let info = { order: q.get('order'), token: q.get('token') };
if(!info.order){ info = JSON.parse(localStorage.getItem('lastOrder') || '{}'); }
else { localStorage.setItem('lastOrder', JSON.stringify(info)); }
const box = document.getElementById('box');

async function check(){
  if(!info.order){ box.innerHTML = '<h1>No order found</h1><p>Contact us on WhatsApp or Telegram for help.</p><a class="home" href="/">Back to shop</a>'; return; }
  const r = await (await fetch('/api/order-status?order=' + encodeURIComponent(info.order) + '&token=' + encodeURIComponent(info.token))).json();
  if(r.status === 'delivered'){
    box.innerHTML = '<h1>Payment received!</h1><p>Your ' + r.product + ':</p><div class="code" id="c"></div><button class="btn" onclick="copyCode()">Copy</button> <button class="btn" onclick="downloadTxt()">Download .txt</button><p style="margin-top:16px">Save it somewhere safe. Order ID: ' + info.order + '</p><a class="home" href="/">Back to shop</a>';
    document.getElementById('c').textContent = r.code;
  } else if(r.status === 'problem'){
    box.innerHTML = '<h1>Payment received</h1><p>Our team will send your item shortly. Please contact us on WhatsApp or Telegram with Order ID: ' + info.order + '</p>';
  } else if(r.status === 'not_found'){
    box.innerHTML = '<h1>Order not found</h1><p>Contact us on WhatsApp or Telegram for help.</p>';
  } else { setTimeout(check, 5000); }
}
function downloadTxt(){
  const t = 'NexaCart Shop\nOrder ID: ' + info.order + '\n\nYour item:\n' + document.getElementById('c').textContent + '\n\nNeed help? Contact us on WhatsApp or Telegram.';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type:'text/plain' }));
  a.download = 'NexaCart-' + info.order + '.txt';
  a.click();
}
function copyCode(){ navigator.clipboard.writeText(document.getElementById('c').textContent); alert('Copied!'); }
check();
</script>
</body>
</html>
